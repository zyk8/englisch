<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#5a9e1e">
<title>Englisch üben – Green Line 1</title>
<style>
:root{--g:#5a9e1e;--g2:#e9f5dc;--d:#1f2a1a;--r:#d23b3b;--r2:#fde8e8;--b:#2f6fb5;--bg:#f6f8f3;--card:#fff;--mut:#6b7466}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--d);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:54px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:16px}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:0;border-radius:16px;padding:16px 12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:16px;color:var(--d);cursor:pointer;width:100%}
.tile .ic{font-size:38px;display:block;margin-bottom:6px}
.tile b{display:block;font-size:17px}
.tile small{color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:0;border-radius:14px;padding:14px;margin:0 0 10px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:left;font-size:16px;color:var(--d);cursor:pointer}
.row .ic{font-size:28px}
.row .tx{flex:1}
.row small{display:block;color:var(--mut)}
.badge{min-width:54px;text-align:center;border-radius:20px;padding:4px 8px;font-weight:700;font-size:14px;background:#eee;color:var(--mut)}
.badge.good{background:var(--g2);color:var(--g)}
.badge.mid{background:#fff4d6;color:#a06a00}
.badge.bad{background:var(--r2);color:var(--r)}
.bar{height:10px;background:#e4e8df;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g)}
.rule{background:#eef5fb;border-left:4px solid var(--b);padding:10px 12px;border-radius:8px;font-size:15px;margin-bottom:12px}
.q{font-size:21px;margin:6px 0 16px}
.q .gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--g);text-align:center;color:var(--g);font-weight:700}
.opts{display:grid;gap:10px}
.opt{width:100%;padding:14px;border-radius:12px;border:2px solid #dfe5d8;background:#fff;font-size:18px;text-align:left;cursor:pointer;color:var(--d)}
.opt.right{border-color:var(--g);background:var(--g2)}
.opt.wrong{border-color:var(--r);background:var(--r2)}
.opt:disabled{cursor:default}
.ok{color:var(--g);font-weight:700}.no{color:var(--r);font-weight:700}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:18px;font-weight:600;margin-top:12px;cursor:pointer}
.btn.sec{background:#e4e8df;color:var(--d)}
.btn.blue{background:var(--b)}
.btn:disabled{opacity:.5}
input[type=text],input[type=password],textarea,select{width:100%;font-size:18px;padding:12px;border:2px solid #dfe5d8;border-radius:12px;font-family:inherit;background:#fff}
textarea{min-height:220px}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:16px}
.fb.right{background:var(--g2)}.fb.wrong{background:var(--r2)}
.prog{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.chip{padding:10px 14px;border-radius:10px;border:2px solid #cfd8c5;background:#fff;font-size:18px;cursor:pointer;color:var(--d)}
.answer{border:2px dashed #cfd8c5;border-radius:12px;padding:8px;margin-bottom:12px;min-height:60px}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;text-align:center;cursor:pointer;user-select:none}
.flash small{font-size:14px;color:var(--mut);margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:54px;text-align:center;margin:6px 0}
.center{text-align:center}
.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
details{margin:6px 0}
summary{cursor:pointer}
.mist{font-size:13px;white-space:pre-wrap;background:#fafafa;border-radius:8px;padding:8px;margin-top:4px}
.checks li{list-style:none;margin:4px 0}
.checks{padding:0;margin:8px 0}
.tag{display:inline-block;background:#eef2e8;border-radius:8px;padding:3px 8px;margin:3px;font-size:14px}
.status{font-size:13px;color:var(--mut);text-align:center;margin-top:10px}

</style>
</head>

<script>
// ===== App =====
const $main = document.getElementById('main');
const $title = document.getElementById('title');
const $back = document.getElementById('back');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function strip(h) { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a, n) { return shuffle(a).slice(0, n); }
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function cls(p) { return p >= 80 ? 'good' : p >= 50 ? 'mid' : 'bad'; }
function fmtDate(ts) { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }
function exById(id) { return EXERCISES.find(e => e.id === id); }
function topicById(id) { return TOPICS.find(t => t.id === id); }

// ---------- Daten: lokal + Google Sheet ----------
let remoteRows = null, remoteStatus = CONFIG.SHEET_URL ? 'lädt …' : 'nicht eingerichtet', remoteAt = 0;

function normRow(r) {
  const exId = String(r.ex || '').split(' ')[0];
  return { id: String(r.id || ''), ts: new Date(r.ts).getTime() || 0, kid: String(r.kid || ''), topic: String(r.topic || ''), exId: exId,
    exTitle: String(r.ex || '').slice(exId.length + 1), correct: +r.correct || 0, total: +r.total || 0, percent: +r.percent || 0,
    seconds: +r.seconds || 0, mistakes: String(r.mistakes || ''), text: String(r.text || '') };
}
function allRows(kid) {
  const map = new Map();
  (remoteRows || []).forEach(r => map.set(r.id, r));
  lsGet('eng_hist', []).map(normRow).forEach(r => { if (!map.has(r.id)) map.set(r.id, r); });
  let rows = [...map.values()].filter(r => r.kid && r.kid !== 'TEST');
  if (kid != null) rows = rows.filter(r => r.kid === kid);
  return rows.sort((a, b) => b.ts - a.ts);
}
async function refreshRemote(force) {
  if (!CONFIG.SHEET_URL) return false;
  if (!force && Date.now() - remoteAt < 20000) return false;
  remoteAt = Date.now();
  try {
    const r = await fetch(CONFIG.SHEET_URL + '?t=' + Date.now());
    const j = await r.json();
    const before = remoteRows ? remoteRows.length : -1;
    remoteRows = (j.rows || []).map(normRow);
    remoteStatus = 'verbunden';
    return remoteRows.length !== before;
  } catch (e) { remoteStatus = 'offline (nur dieses Gerät)'; return false; }
}
async function flushQueue() {
  if (!CONFIG.SHEET_URL) return;
  const q = lsGet('eng_queue', []);
  const left = [];
  for (const rec of q) {
    try {
      await fetch(CONFIG.SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rec) });
    } catch (e) { left.push(rec); }
  }
  lsSet('eng_queue', left);
  remoteAt = 0;
}
function saveRecord(rec) {
  const h = lsGet('eng_hist', []); h.push(rec); lsSet('eng_hist', h.slice(-500));
  const q = lsGet('eng_queue', []); q.push(rec); lsSet('eng_queue', q);
  flushQueue();
}
function bestByEx(rows) {
  const m = {};
  rows.forEach(r => {
    const b = m[r.exId] || (m[r.exId] = { best: 0, last: null, n: 0, lastTs: 0 });
    b.best = Math.max(b.best, r.percent); b.n++;
    if (r.ts > b.lastTs) { b.lastTs = r.ts; b.last = r.percent; }
  });
  return m;
}

// ---------- Routing ----------
function go(h) { location.hash = h; }
window.addEventListener('hashchange', render);
let run = null;

function render() {
  const h = location.hash.replace(/^#\/?/, '');
  const p = h.split('/');
  window.scrollTo(0, 0);

  }

}

// ---------- Aufgaben erzeugen ----------
function vocabVariants(en) {
  const base = [en, en.replace(/\s*\(.*?\)/g, ''), en.replace(/[()]/g, '')];
  const out = new Set();
  base.forEach(b => { out.add(b); out.add(b.replace(/^to /, '')); });
  return [...out];
}
function genItems(ex) {
  if (ex.gen === 'en2de') return pick(VOCAB, ex.n).map(v => MC('<b>' + esc(v[0]) + '</b>', shuffle([v[1]].concat(pick(VOCAB.filter(x => x !== v), 3).map(x => x[1]))), v[1]));
  if (ex.gen === 'de2en') return pick(VOCAB, ex.n).map(v => MC('<b>' + esc(v[1]) + '</b>', shuffle([v[0]].concat(pick(VOCAB.filter(x => x !== v), 3).map(x => x[0]))), v[0]));
  if (ex.gen === 'type') return pick(VOCAB, ex.n).map(v => Object.assign(TY(esc(v[1]), vocabVariants(v[0])), { vocab: true }));
  if (ex.gen === 'test' || ex.gen === 'testgram') {
    const topics = ex.gen === 'test' ? ['can', 'poss', 'have', 'write', 'vocab'] : ['can', 'poss', 'have'];
    let pool = [];
    EXERCISES.filter(e => topics.includes(e.topic) && e.items).forEach(e => e.items.forEach(it => pool.push(Object.assign({}, it, { keep: e.keep }))));
    if (ex.gen === 'test') pool = pool.concat(genItems({ gen: 'type', n: 6 }));
    return pick(pool, ex.n);
  }
  return [];
}
function prepItems(ex) {
  const src = ex.items ? ex.items.map(it => Object.assign({}, it, { keep: ex.keep })) : genItems(ex);
  return shuffle(src).map(it => {
    if (it.t === 'mc' && !it.keep) it.o = shuffle(it.o);
    if (it.t === 'order') {
      const w = it.s.split(' ');
      let s = shuffle(w);
      for (let i = 0; i < 5 && s.join(' ') === it.s && w.length > 2; i++) s = shuffle(w);
      it.words = s;
    }
    return it;
  });
}

// ---------- Antworten prüfen ----------
function canon(s) {
  s = String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[–—]/g, ' ').replace(/ - /g, ' ');
  s = s.replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot');
  s = s.replace(/(\w)'s got\b/g, '$1 has got');
  s = s.replace(/n't\b/g, ' not').replace(/'ve\b/g, ' have').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are');
  s = s.replace(/\b(he|she|it|what|where|who|that|there|how)'s\b/g, '$1 is');
  s = s.replace(/[.!?,;:"()]/g, ' ').replace(/\s+/g, ' ').trim();
  return s;
}
function canonV(s) { return canon(s).replace(/^to /, ''); }
function lev(a, b) {
  const m = []; for (let i = 0; i <= a.length; i++) { m[i] = [i]; }
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}

// ---------- Übung starten ----------
function startExercise(k, exId, retryItems) {
  const ex = exById(exId), kid = CONFIG.KIDS[k];
  if (!ex) return go('k/' + k);
  setHeader(ex.title, 'k/' + k + '/t/' + ex.topic);
  if (ex.write) return viewWrite(k, ex);
  if (ex.flash) return viewFlashStart(k, ex);
  run = { k: k, kid: kid.name, ex: ex, items: retryItems || prepItems(ex), i: 0, correct: 0, wrong: [], mistakes: [], start: Date.now(), retry: !!retryItems };
  renderItem();
}
function itemHead() {
  const r = run;
  return `<div class="prog"><span>Aufgabe ${r.i + 1} / ${r.items.length}${r.retry ? ' · Wiederholung' : ''}</span><span>✓ ${r.correct}</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${Math.round(r.i / r.items.length * 100)}%"></i></div>`;
}
function qHtml(q) { return q.replace(/___/g, '<span class="gap">___</span>'); }
function renderItem() {
  const r = run, it = r.items[r.i];
  const intro = r.i === 0 && r.ex.intro ? `<div class="rule">${r.ex.intro}</div>` : '';
  let body = '';
  if (it.t === 'mc') {
    body = `<div class="q">${qHtml(it.q)}</div><div class="opts">` + it.o.map((o, n) => `<button class="opt" data-n="${n}">${esc(o)}</button>`).join('') + '</div>';
  } else if (it.t === 'type') {
    body = `<div class="q">${it.q}</div><input type="text" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Auf Englisch …"><button class="btn" id="chk">Prüfen</button>`;
  } else if (it.t === 'order') {
    body = '<div class="mut" style="margin-bottom:8px">Dein Satz:</div><div class="answer chips" id="ans"></div><div class="chips" id="pool"></div><button class="btn" id="chk" disabled>Prüfen</button>';
  }
  $main.innerHTML = itemHead() + intro + `<div class="card">${body}<div id="fb"></div></div>`;
  if (it.t === 'mc') $main.querySelectorAll('.opt').forEach(b => b.onclick = () => answerMC(+b.dataset.n));
  if (it.t === 'type') {
    const inp = document.getElementById('inp'); inp.focus();
    inp.onkeydown = e => { if (e.key === 'Enter') answerType(); };
    document.getElementById('chk').onclick = answerType;
  }
  if (it.t === 'order') setupOrder(it);
}
function feedback(ok, given, expected, extra) {
  const r = run, it = r.items[r.i];
  if (ok) r.correct++;
  else { r.wrong.push(it); r.mistakes.push(strip(it.q).slice(0, 90) + ' → ' + given + ' (richtig: ' + expected + ')'); }
  const praise = ['Super!', 'Richtig!', 'Genau!', 'Klasse!', 'Stark!'][Math.floor(Math.random() * 5)];
  const hint = it.h ? `<div>💡 ${it.h}</div>` : '';
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok ? 'right' : 'wrong'}">${ok ? '✅ <b>' + praise + '</b>' : '❌ <b>Leider falsch.</b> Richtig ist: <b>' + esc(expected) + '</b>'}${extra || ''}${!ok || it.h ? hint : ''}</div><button class="btn" id="next">${r.i + 1 < r.items.length ? 'Weiter →' : 'Ergebnis ansehen'}</button>`;
  const nx = document.getElementById('next'); nx.onclick = nextItem; nx.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function answerMC(n) {
  const it = run.items[run.i], given = it.o[n], ok = given === it.a;
  $main.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (it.o[i] === it.a) b.classList.add('right'); else if (i === n) b.classList.add('wrong'); });
  feedback(ok, given, it.a);
}
function answerType() {
  const it = run.items[run.i], inp = document.getElementById('inp');
  const given = inp.value.trim(); if (!given) { inp.focus(); return; }
  inp.disabled = true; document.getElementById('chk').style.display = 'none';
  const f = it.vocab ? canonV : canon;
  const g = f(given);
  const ok = it.a.some(a => f(a) === g);
  let extra = '';
  if (!ok && it.a.some(a => lev(f(a), g) <= 2)) extra = '<div>Fast! Achte genau auf die Schreibweise.</div>';
  feedback(ok, given, it.a[0], extra);
}
function setupOrder(it) {
  const chosen = [];
  const pool = document.getElementById('pool'), ans = document.getElementById('ans'), chk = document.getElementById('chk');
  const draw = () => {
    pool.innerHTML = it.words.map((w, i) => chosen.includes(i) ? '' : `<button class="chip" data-i="${i}">${esc(w)}</button>`).join('');
    ans.innerHTML = chosen.map((i, p) => `<button class="chip" data-p="${p}">${esc(it.words[i])}</button>`).join('');
    pool.querySelectorAll('.chip').forEach(b => b.onclick = () => { chosen.push(+b.dataset.i); draw(); });
    ans.querySelectorAll('.chip').forEach(b => b.onclick = () => { chosen.splice(+b.dataset.p, 1); draw(); });
    chk.disabled = chosen.length !== it.words.length;
  };
  draw();
  chk.onclick = () => {
    const built = chosen.map(i => it.words[i]).join(' ');
    const ok = [it.s].concat(it.alts).some(s => s.toLowerCase() === built.toLowerCase());
    pool.innerHTML = ''; ans.querySelectorAll('.chip').forEach(b => b.disabled = true);
    chk.style.display = 'none';
    feedback(ok, built, it.s);
  };
}
function nextItem() {
  run.i++;
  if (run.i < run.items.length) renderItem(); else finish();
}
function stars(p) { return p >= 90 ? '⭐⭐⭐' : p >= 70 ? '⭐⭐' : p >= 50 ? '⭐' : '💪'; }
function finish() {
  const r = run, total = r.items.length, pct = Math.round(r.correct / total * 100);
  const sec = Math.round((Date.now() - r.start) / 1000);
  if (!r.retry) saveRecord({ id: uid(), ts: Date.now(), kid: r.kid, topic: r.ex.topic, ex: r.ex.id + ' ' + r.ex.title, correct: r.correct, total: total, percent: pct, seconds: sec, mistakes: r.mistakes.join('\n'), text: '' });
  const msg = pct >= 90 ? 'Hervorragend!' : pct >= 70 ? 'Gut gemacht!' : pct >= 50 ? 'Schon ganz gut – übe die Fehler nochmal.' : 'Nicht aufgeben! Lies die Regel und versuch es nochmal.';
  const back = 'k/' + r.k + '/t/' + r.ex.topic;
  $main.innerHTML = `<div class="card center"><div class="big">${stars(pct)}</div><h2 style="margin:4px 0">${r.correct} von ${total} richtig (${pct} %)</h2><div>${msg}</div>${r.retry ? '<div class="mut">(Wiederholung wird nicht gespeichert)</div>' : ''}</div>` +
    (r.wrong.length ? `<div class="card"><b>Deine Fehler:</b><div class="mist">${esc(r.mistakes.join('\n'))}</div></div><button class="btn blue" id="retry">Fehler nochmal üben (${r.wrong.length})</button>` : '') +
    `<button class="btn" id="again">Ganze Übung nochmal</button><button class="btn sec" onclick="go('${back}')">Zurück zur Übersicht</button>`;
  if (r.wrong.length) document.getElementById('retry').onclick = () => startExercise(r.k, r.ex.id, prepRetry(r.wrong));
  document.getElementById('again').onclick = () => startExercise(r.k, r.ex.id);
}
function prepRetry(items) { return shuffle(items.map(it => Object.assign({}, it))); }

// ---------- Karteikarten ----------
function viewFlashStart(k, ex) {
  $main.innerHTML = `<div class="rule">${ex.intro}</div><div class="card"><b>Welche Richtung?</b><button class="btn" id="d1">Englisch → Deutsch</button><button class="btn blue" id="d2">Deutsch → Englisch</button></div>`;
  document.getElementById('d1').onclick = () => flashRun(k, ex, false, shuffle(VOCAB));
  document.getElementById('d2').onclick = () => flashRun(k, ex, true, shuffle(VOCAB));
}
function flashRun(k, ex, de, deck, retry) {
  const st = { i: 0, known: 0, unknown: [], start: Date.now() };
  const draw = () => {
    const v = deck[st.i], front = de ? v[1] : v[0], back = de ? v[0] : v[1];
    $main.innerHTML = `<div class="prog"><span>Karte ${st.i + 1} / ${deck.length}${retry ? ' · Wiederholung' : ''}</span><span>✓ ${st.known}</span></div><div class="bar" style="margin-bottom:12px"><i style="width:${Math.round(st.i / deck.length * 100)}%"></i></div>` +
      `<div class="card flash" id="fc"><b>${esc(front)}</b><small>Tippen zum Umdrehen</small></div><div id="fbtn"></div>`;
    document.getElementById('fc').onclick = () => {
      document.getElementById('fc').innerHTML = `<span class="mut" style="font-size:18px">${esc(front)}</span><b style="margin-top:8px">${esc(back)}</b>`;
      document.getElementById('fbtn').innerHTML = '<div class="two"><button class="btn sec" id="no">❌ Nicht gewusst</button><button class="btn" id="yes">✅ Gewusst</button></div>';
      document.getElementById('yes').onclick = () => { st.known++; nxt(); };
      document.getElementById('no').onclick = () => { st.unknown.push(v); nxt(); };
    };
  };
  const nxt = () => { st.i++; if (st.i < deck.length) draw(); else done(); };
  const done = () => {
    const pct = Math.round(st.known / deck.length * 100);
    if (!retry) saveRecord({ id: uid(), ts: Date.now(), kid: CONFIG.KIDS[k].name, topic: ex.topic, ex: ex.id + ' ' + ex.title + (de ? ' (DE→EN)' : ' (EN→DE)'), correct: st.known, total: deck.length, percent: pct, seconds: Math.round((Date.now() - st.start) / 1000), mistakes: st.unknown.map(v => v[0] + ' = ' + v[1]).join('\n'), text: '' });
    $main.innerHTML = `<div class="card center"><div class="big">${stars(pct)}</div><h2 style="margin:4px 0">${st.known} von ${deck.length} gewusst (${pct} %)</h2></div>` +
      (st.unknown.length ? `<div class="card"><b>Diese Wörter nochmal lernen:</b><div class="mist">${esc(st.unknown.map(v => v[0] + ' = ' + v[1]).join('\n'))}</div></div><button class="btn blue" id="rt">Nicht gewusste nochmal (${st.unknown.length})</button>` : '') +
      `<button class="btn sec" onclick="go('k/${k}/t/${ex.topic}')">Zurück zur Übersicht</button>`;
    if (st.unknown.length) document.getElementById('rt').onclick = () => flashRun(k, ex, de, shuffle(st.unknown), true);
  };
  draw();
}

// ---------- Freies Schreiben ----------
const WRITE_CHECKS = [
  ['Mindestens 6 Sätze', t => sentences(t) >= 6],
  ['have got / has got', t => /\b(i|you|we|they|he|she|it)'(ve|s) got\b|\b(have|has) got\b/i.test(t)],
  ["haven't got / hasn't got", t => /\b(haven't|hasn't|have not|has not) got\b/i.test(norm(t))],
  ['can', t => /\bcan\s+[a-z]/i.test(t)],
  ["can't", t => /\b(can't|cannot)\b/i.test(norm(t))],
  ['There is / There are', t => /\bthere(?:'s|\s+(?:is|are|isn't|aren't))\b/i.test(norm(t))],
  ['my / our / their …', t => /\b(my|our|their|his|her|its|your)\b/i.test(t)]
];
const WRITE_WARN = [
  [/\b(he|she|it) have\b/i, 'he/she/it → <b>has</b> got'],
  [/\b(i|you|we|they) has\b/i, 'I/you/we/they → <b>have</b> got'],
  [/\b(i|you|we|they)'ven't\b/i, "Verneinung: <b>haven't got</b> (nicht 've n't)"],
  [/\b(i|you|we|they) hasn't\b/i, "I/you/we/they → <b>haven't</b> got"],
  [/\b(he|she|it) haven't\b/i, "he/she/it → <b>hasn't</b> got"],
  [/\bcans\b|\bcan to\b/i, 'can hat nie ein -s und kein to: he can sing'],
  [/\ba (?:a|e|i|o)[a-z]+/i, 'Vor a, e, i, o → <b>an</b> (an art room, an idea)']
];
function norm(t) { return t.replace(/[’‘`´]/g, "'"); }
function sentences(t) { return norm(t).split(/[.!?]+/).filter(s => s.trim().split(/\s+/).length >= 3).length; }
function viewWrite(k, ex) {
  const draftKey = 'eng_draft_' + k + '_' + ex.id;
  const start = Date.now();
  $main.innerHTML = `<div class="rule">${ex.intro}</div><div class="card"><b>Nützliche Sätze:</b><div>${ex.phrases.map(p => `<span class="tag">${esc(p)}</span>`).join('')}</div></div>` +
    `<div class="card"><textarea id="ta" placeholder="Schreibe hier auf Englisch …" autocapitalize="sentences" spellcheck="false"></textarea><ul class="checks" id="ck"></ul><div id="warn"></div><button class="btn" id="sub" disabled>Fertig – abgeben</button></div>`;
  const ta = document.getElementById('ta');
  ta.value = lsGet(draftKey, '');
  const upd = () => {
    const t = ta.value;
    lsSet(draftKey, t);
    document.getElementById('ck').innerHTML = WRITE_CHECKS.map(c => `<li>${c[1](t) ? '✅' : '⬜'} ${esc(c[0])}</li>`).join('');
    const w = WRITE_WARN.filter(x => x[0].test(norm(t))).map(x => '⚠️ ' + x[1]);
    document.getElementById('warn').innerHTML = w.length ? `<div class="fb wrong">${w.join('<br>')}</div>` : '';
    document.getElementById('sub').disabled = sentences(t) < 3;
  };
  ta.oninput = upd; upd();
  document.getElementById('sub').onclick = () => {
    const t = ta.value.trim();
    const met = WRITE_CHECKS.filter(c => c[1](t));
    const pct = Math.round(met.length / WRITE_CHECKS.length * 100);
    const warns = WRITE_WARN.filter(x => x[0].test(norm(t))).map(x => strip(x[1]));
    saveRecord({ id: uid(), ts: Date.now(), kid: CONFIG.KIDS[k].name, topic: ex.topic, ex: ex.id + ' ' + ex.title, correct: met.length, total: WRITE_CHECKS.length, percent: pct, seconds: Math.round((Date.now() - start) / 1000), mistakes: warns.join('\n'), text: t });
    lsSet(draftKey, '');
    $main.innerHTML = `<div class="card center"><div class="big">${stars(pct)}</div><h2 style="margin:4px 0">${met.length} von ${WRITE_CHECKS.length} Punkten der Checkliste</h2><div class="mut">Dein Text wurde gespeichert. Mama oder Papa können ihn lesen.</div></div>` +
      `<div class="card"><b>Dein Text:</b><div class="mist">${esc(t)}</div></div>` +
      (warns.length ? `<div class="card"><b>Prüfe nochmal:</b><div class="mist">${esc(warns.join('\n'))}</div></div>` : '') +
      `<div class="card"><b>So könnte ein Beispieltext aussehen:</b><div class="mist">${esc(ex.model)}</div></div>` +
      `<button class="btn" onclick="go('k/${k}/e/${ex.id}')">Neuen Text schreiben</button><button class="btn sec" onclick="go('k/${k}/t/${ex.topic}')">Zurück zur Übersicht</button>`;
  };
}

  const sel = sessionStorage.getItem('eng_pkid') || CONFIG.KIDS[0].name;
  $main.innerHTML = `<div class="card"><select id="ks">${CONFIG.KIDS.map(k => `<option ${k.name === sel ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select><button class="btn sec" id="rf">🔄 Aktualisieren</button><div class="status" id="st"></div></div><div id="pv">Lädt …</div>`;
  document.getElementById('ks').onchange = e => { sessionStorage.setItem('eng_pkid', e.target.value); drawParent(); };
  document.getElementById('rf').onclick = async () => { document.getElementById('st').textContent = 'lädt …'; await flushQueue(); await refreshRemote(true); drawParent(); };
  drawParent();
  refreshRemote(true).then(() => drawParent());
}
function drawParent() {
  const pv = document.getElementById('pv'); if (!pv) return;
  const kid = document.getElementById('ks').value;
  document.getElementById('st').textContent = 'Google Sheet: ' + remoteStatus + (lsGet('eng_queue', []).length ? ' · ' + lsGet('eng_queue', []).length + ' Ergebnis(se) warten aufs Senden' : '');
  const rows = allRows(kid);
  if (!rows.length) { pv.innerHTML = '<div class="card mut">Noch keine Ergebnisse für ' + esc(kid) + '.</div>'; return; }
  const mins = Math.round(rows.reduce((s, r) => s + r.seconds, 0) / 60);
  const graded = rows.filter(r => r.topic !== 'write');
  const avg = graded.length ? Math.round(graded.reduce((s, r) => s + r.percent, 0) / graded.length) : 0;
  const days = new Set(rows.map(r => new Date(r.ts).toDateString())).size;
  const best = bestByEx(rows);
  let html = `<div class="card"><b>${esc(kid)}</b><table><tr><td>Übungen gemacht</td><td><b>${rows.length}</b></td></tr><tr><td>Übungszeit gesamt</td><td><b>${mins} Min.</b></td></tr><tr><td>Tage mit Übung</td><td><b>${days}</b></td></tr><tr><td>Ø richtig</td><td><b>${graded.length ? avg + ' %' : '–'}</b></td></tr><tr><td>Zuletzt aktiv</td><td><b>${fmtDate(rows[0].ts)}</b></td></tr></table></div>`;
  html += '<div class="card"><b>Fortschritt nach Thema</b>' + TOPICS.map(t => {
    const exs = topicExercises(t.id);
    const done = exs.filter(e => (best[e.id] || {}).best >= 80).length;
    const tr = exs.map(e => { const b = best[e.id]; return `<tr><td>${esc(e.title)}</td><td>${b ? b.n + '×' : '–'}</td><td>${b ? `<span class="badge ${cls(b.best)}">${b.best} %</span>` : ''}</td><td>${b ? b.last + ' %' : ''}</td></tr>`; }).join('');
    return `<details><summary>${t.icon} ${esc(t.title)} – <b>${done}/${exs.length}</b> geschafft</summary><table><tr><th>Übung</th><th>Mal</th><th>Beste</th><th>Letzte</th></tr>${tr}</table></details>`;
  }).join('') + '</div>';
  const cnt = {};
  graded.forEach(r => r.mistakes.split('\n').filter(Boolean).forEach(m => { const key = m.split(' → ')[0]; cnt[key] = cnt[key] || { n: 0, ex: m }; cnt[key].n++; cnt[key].ex = m; }));
  const top = Object.values(cnt).sort((a, b) => b.n - a.n).slice(0, 12);
  if (top.length) html += '<div class="card"><b>Häufigste Fehler</b><div class="mist">' + top.map(t => `${t.n}× ${esc(t.ex)}`).join('\n') + '</div></div>';
  const texts = rows.filter(r => r.text);
  if (texts.length) html += '<div class="card"><b>Geschriebene Texte</b>' + texts.map(r => `<details><summary>${fmtDate(r.ts)} – ${esc(r.exTitle)}</summary><div class="mist">${esc(r.text)}</div>${r.mistakes ? `<div class="mist">⚠️ ${esc(r.mistakes)}</div>` : ''}</details>`).join('') + '</div>';
  html += '<div class="card"><b>Letzte Übungen</b>' + rows.slice(0, 30).map(r => `<details><summary>${fmtDate(r.ts)} · ${esc(r.exTitle || r.exId)} · <span class="badge ${cls(r.percent)}">${r.percent} %</span> · ${Math.max(1, Math.round(r.seconds / 60))} Min.</summary>${r.mistakes ? `<div class="mist">${esc(r.mistakes)}</div>` : '<div class="mut">Keine Fehler.</div>'}</details>`).join('') + '</div>';
  html += '<button class="btn sec" onclick="sessionStorage.removeItem(\'eng_parent\');go(\'\')">Eltern-Bereich verlassen</button>';
  pv.innerHTML = html;
}

render();
refreshRemote(true);
flushQueue();

</script>
</body>
</html>
